        <main>
            <section id="formCadastro">
                <h1>Cadastre-se</h1>
                <p>Crie sua conta na EduTech</p>
                <form>
                    <label for="nomeCadastro">Nome completo</label>
                    <input id="nomeCadastro" type="text" required>
                    <br>
                    <label for="emailcadastro">senhalogin</label>
                    <input id="emailcadastro" type="email" required>
                    <br>
                    <label for="senhacadastro">Senha</label>
                    <input id="senhacadastro" type="password" required>
                    <br>
                    <label for="confirmeCadastro">confirme sua senha</label>
                    <input id="confirmeCadastro" type="password" required>
                    <br>
                    <button type="submit">Cadastra-se</button>
                </form>
                <p>já tem uma conta? <a href="login.html">fazer login</a></p>
            </section>
        </main>
